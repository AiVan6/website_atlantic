services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlantic
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-atlanticdb}
      DB_USERNAME: ${DB_USERNAME:-atlantic}
      DB_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в файле .env}
      PORT: 8080
    # Снаружи сайт доступен только через Caddy (80/443); порт приложения — для локальной проверки.
    ports:
      - "127.0.0.1:${SITE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    container_name: atlantic-caddy
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # сертификаты и ключи — не удалять, иначе упрётесь в лимиты Let's Encrypt
      - caddy_config:/config
    networks:
      - backend
    depends_on:
      site:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: atlantic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-atlanticdb}
      POSTGRES_USER: ${DB_USERNAME:-atlantic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в файле .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./atlantica.dump:/docker-entrypoint-initdb.d/dump/atlantica.dump:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    # Порт БД доступен только с локальной машины (для IDE и локального запуска backend).
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

networks:
  backend:
    driver: bridge

volumes:
  db_data:
  caddy_data:
  caddy_config:
