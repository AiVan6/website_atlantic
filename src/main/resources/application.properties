server.port=${PORT:8080}
# За обратным прокси (Caddy): учитывать X-Forwarded-Proto/For от доверенных внутренних адресов
server.forward-headers-strategy=native

# --- База данных ---
# Секреты не хранятся в репозитории: задайте DB_PASSWORD (и при необходимости DB_URL, DB_USERNAME)
# через переменные окружения. См. .env.example и README.md.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/atlanticdb}
spring.datasource.username=${DB_USERNAME:atlantic}
spring.datasource.password=${DB_PASSWORD:}

# Схема создаётся дампом atlantica.dump; Hibernate только проверяет соответствие.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- HTTP ---
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# index.html и прочая статика без хэша в имени — всегда с ревалидацией (см. также WebConfig)
spring.web.resources.cache.cachecontrol.no-cache=true
